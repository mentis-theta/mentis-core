  <style>
    /* Melhoria na rolagem para mobile/tablet (Momentum Scrolling) */
    html,
    body {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: none;
      /* Previne o "bounce" da página inteira no topo/fundo */
    }

    /* Custom Scrollbars - Visíveis mas elegantes */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
      /* Altura para scroll horizontal */
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      /* slate-300 */
      border-radius: 10px;
      border: 2px solid transparent;
      /* Cria um padding visual */
      background-clip: content-box;
    }

    .dark ::-webkit-scrollbar-thumb {
      background: #475569;
      /* slate-600 */
      border: 2px solid transparent;
      background-clip: content-box;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
      /* slate-400 */
    }

    /* Utilitário para forçar visibilidade do scroll */
    .force-scroll-x {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* Utilitário para Canvas do React Flow no Mobile */
    .touch-action-none {
      touch-action: none;
    }

    /* React Flow Customization for Dark Mode */
    .dark .react-flow__node {
      border-color: #475569;
      background: #1e293b;
      color: #e2e8f0;
    }

    .dark .react-flow__handle {
      background: #94a3b8;
    }

    .dark .react-flow__edge-path {
      stroke: #94a3b8;
    }

    .dark .react-flow__controls button {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      fill: #e2e8f0;
    }

    .dark .react-flow__controls button:hover {
      background: #334155;
    }

    /* Missing Utilities from CSS */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .mask-linear-fade {
      /* Fallback for safety */
      -webkit-mask-image: linear-gradient(to right, black 85%, transparent 100%);
      mask-image: linear-gradient(to right, black 85%, transparent 100%);
    }
  </style>
